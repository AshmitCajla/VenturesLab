# One command: `docker compose up --build`
#   UI            http://localhost:8501
#   API           http://localhost:8000/docs   (metrics at /metrics, SLOs at /slo)
#   Grafana       http://localhost:3000        (dashboards: VenturesLab · Ops / Cost / Customer experience)
#   Prometheus    http://localhost:9090        (alerts: /alerts)
#   Alertmanager  http://localhost:9093
#   Jaeger        http://localhost:16686       (traces: service ventureslab-api)
# The Slack bot starts inside the API when SLACK_BOT_TOKEN and SLACK_APP_TOKEN are set in backend/.env.
services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    stop_grace_period: 150s  # let analyses in progress finish (SHUTDOWN_GRACE_S=120)
    environment:
      PORT: 8000
      DB_PATH: /app/data/ventureslab.db
      LOG_DIR: /app/data/logs
      RUNBOOK_DIR: /docs/runbooks
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318
      PROMETHEUS_URL: http://prometheus:9090
      JAEGER_URL: http://jaeger:16686
      PUBLIC_UI_URL: ${PUBLIC_UI_URL:-http://localhost:8501}
    volumes:
      - ventureslab-data:/app/data
      - ./docs:/docs:ro
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
      GRAFANA_URL: ${GRAFANA_URL:-http://localhost:3000}
    ports: ["8501:8501"]
    depends_on: [backend]

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
    ports: ["9090:9090"]
    depends_on: [backend]

  alertmanager:
    image: prom/alertmanager:v0.28.1
    environment:
      ALERT_WEBHOOK_TOKEN: ${ALERT_WEBHOOK_TOKEN:-}
    entrypoint: ["/bin/sh", "-c", "printf '%s' \"$$ALERT_WEBHOOK_TOKEN\" > /tmp/webhook_token && exec /bin/alertmanager --config.file=/etc/alertmanager/alertmanager.yml"]
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports: ["9093:9093"]

  grafana:
    image: grafana/grafana:12.1.1
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/vl-ops.json
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.72.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686", "4318:4318"]

volumes:
  ventureslab-data:
