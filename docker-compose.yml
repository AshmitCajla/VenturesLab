services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 8000
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://backend:8000
    ports: ["8501:8501"]
    depends_on: [backend]
