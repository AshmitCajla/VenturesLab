# Free path: Render → New → Blueprint → this repo. Serves the API, the Slack bot (Socket Mode)
# and the MCP endpoint (/mcp) from one free web service. See docs/deployment.md.
services:
  - type: web
    name: ventureslab-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    maxShutdownDelaySeconds: 150   # let analyses in progress finish on deploys
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: API_KEYS                  # required: the API is public
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_APP_TOKEN
        sync: false
      - key: SLACK_OPS_CHANNEL
        sync: false
      - key: SLACK_DIGEST_CHANNEL
        sync: false
      - key: PUBLIC_UI_URL             # the Streamlit Community Cloud URL
        sync: false
      - key: PUBLIC_API_URL            # https://<service>.onrender.com (allows MCP Host headers)
        sync: false
      # 512 MB RAM on the free plan: a 20-slide run peaks at ~455 MB with the ONNX embedder and
      # ~310 MB with the hashing one, so the free plan uses hashing and one analysis at a time.
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: EMBEDDINGS
        value: hash
      - key: LOG_JSON
        value: "1"
