name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . ../frontend ../deploy
      - name: Formatting
        run: ruff format --check . ../frontend ../deploy
      - name: Tests
        run: pytest -q --cov --cov-report=term --cov-report=xml
      - name: Offline evaluation harness
        run: python -m evaluation.run_eval --fake --out /tmp/report.md
      - name: Quality gate (red team, detector false positives, chaos signals, checks)
        run: python -m evaluation.gate --summary "$GITHUB_STEP_SUMMARY"

  observability-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: promtool check config and rules
        run: |
          docker run --rm -v "$PWD/deploy/prometheus:/etc/prometheus" --entrypoint promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
      - name: amtool check-config
        run: docker run --rm -v "$PWD/deploy/alertmanager:/a" --entrypoint amtool prom/alertmanager:v0.28.1 check-config /a/alertmanager.yml
      - name: Dashboards are generated from code
        run: python3 deploy/grafana/build_dashboards.py && git diff --exit-code deploy/grafana/dashboards

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ventureslab-api backend
      - run: docker build -t ventureslab-ui frontend
