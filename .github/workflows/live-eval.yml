# Manual: evaluations that need real models (they cost money and are rate limited).
name: Live evaluation
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "golden | consistency | redteam | chaos"
        default: golden
      repeats:
        default: "2"

jobs:
  live:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DB_PATH: /tmp/ventureslab.db
      LOG_DIR: /tmp/logs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Run
        run: |
          case "${{ inputs.suite }}" in
            golden) python -m evaluation.golden --out /tmp/out.md ;;
            consistency) python -m evaluation.consistency --repeats ${{ inputs.repeats }} --out /tmp/out.md ;;
            redteam) python -m evaluation.redteam --live --repeats ${{ inputs.repeats }} --out /tmp/out.md ;;
            chaos) python -m evaluation.chaos --live --runs ${{ inputs.repeats }} --out /tmp/out.md ;;
          esac
          cat /tmp/out.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: live-eval-${{ inputs.suite }}
          path: /tmp/out.md
